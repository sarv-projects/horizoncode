# HorizonCode workspace.
#
# A single Rust workspace producing the `horizoncode` binary. Crate boundaries mirror
# the architecture component IDs (`CMP-*`) documented in `ARCH/03-ARCHITECTURE.md`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/sarv-projects/horizoncode"
description = "Standalone, protocol-native command-line coding agent."
authors = ["HorizonCode contributors"]

[workspace.dependencies]
# Internal crates.
horizoncode-types = { path = "crates/horizoncode-types", version = "0.1.0" }
horizoncode-session = { path = "crates/horizoncode-session", version = "0.1.0" }
horizoncode-provider = { path = "crates/horizoncode-provider", version = "0.1.0" }
horizoncode-tools = { path = "crates/horizoncode-tools", version = "0.1.0" }
horizoncode-guard = { path = "crates/horizoncode-guard", version = "0.1.0" }
horizoncode-sandbox = { path = "crates/horizoncode-sandbox", version = "0.1.0" }
horizoncode-audit = { path = "crates/horizoncode-audit", version = "0.1.0" }
horizoncode-analytics = { path = "crates/horizoncode-analytics", version = "0.1.0" }
horizoncode-runner = { path = "crates/horizoncode-runner", version = "0.1.0" }
horizoncode-acp = { path = "crates/horizoncode-acp", version = "0.1.0" }
horizoncode-cli = { path = "crates/horizoncode-cli", version = "0.1.0" }
# Test-only support (clock, fault injection, store snapshots, kill points). It is
# a dev-dependency of the test suites and is never linked into the binary;
# `std::fs::File::try_lock` (Rust 1.89) is what removes the need for a
# process-lock dependency.
horizoncode-testkit = { path = "crates/horizoncode-testkit", version = "0.1.0" }

# Tamper-evident hashing for the audit chain and its Merkle roots
# (`ARCH/14-AUDIT.md` §Data / state model).
blake3 = "1.8"

# Local rollup index for analytics; no network, no extensions.
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }

# Async runtime.
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "process",
    "sync",
    "time",
    "signal",
    "net",
    "fs",
] }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors.
thiserror = "2.0"
anyhow = "1.0"

# Identifiers.
uuid = { version = "1.18", features = ["v7"] }

# CLI.
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP provider transport.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures = "0.3"
bytes = "1.10"
httpdate = "1.0"

# Async traits.
async-trait = "0.1"

# Retry jitter.
rand = "0.8"

# Tool implementations.
regex = "1.11"
globset = "0.4"
walkdir = "2.5"

# Home directory resolution.
dirs = "6.0"

# Protocol SDK (Agent Client Protocol), Apache-2.0. Stable v1 API only; the
# JSON-schema feature is not needed by the server. See `crates/horizoncode-acp`.
agent-client-protocol = { version = "2.2", default-features = false }

# Test support.
tempfile = "3.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
