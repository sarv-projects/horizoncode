[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrykit"
version = "0.1.0"
description = "Retry a callable with bounded attempts and exponential backoff"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["retrykit"]
