[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditlog"
version = "1.0.0"
description = "Dependency-free JSONL audit log summarizer (Python standard library only)"
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
auditlog = "auditlog.cli:main"

[tool.setuptools]
packages = ["auditlog", "tests"]
