# The allowlist is intentionally small. A newly required license needs a
# reviewed change and, for uncommon terms, a crate-and-version-specific entry.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]

# The current webpki-roots package declares this distinct permissive data
# license. Keep approval bound to the exact locked release.
exceptions = [
    { crate = "webpki-roots@1.0.9", allow = ["CDLA-Permissive-2.0"] },
]

confidence-threshold = 0.9
