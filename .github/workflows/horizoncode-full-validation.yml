name: HorizonCode full validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  typecheck-and-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Audit all tracked Markdown files
        run: python3 scripts/architecture/audit_markdown_repo.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore pinned source without overwriting overlays
        run: python3 scripts/architecture/bootstrap_source.py --apply
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Full monorepo typecheck and Guard tests
        run: bash scripts/architecture/run_full_gate.sh
