name: HorizonCode full validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  # One authoritative CI run per PR head; obsolete source/test results must not race.
  group: horizoncode-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  typecheck-and-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Audit all tracked Markdown files
        run: python3 scripts/architecture/audit_markdown_repo.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore pinned source without overwriting overlays
        run: python3 scripts/architecture/bootstrap_source.py --apply
      - name: Install bubblewrap for fail-closed install-isolation tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Release tooling syntax, failure paths, and dry-run packaging
        run: |
          bash -n install
          python3 -m unittest scripts.release.test_release_readiness -v
          python3 scripts/release/prepare_build.py \
            --source "$PWD" \
            --destination "$PWD/kernel/target/horizoncode-release/full-gate-dry-run" \
            --dry-run
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Fast contract and source parity preflight
        # Fail before the heavy Turbo/Cargo build if the normative registry/docs
        # contradict the tracked source. The full gate repeats this validation.
        run: |
          python3 scripts/architecture/validate_convergence.py
          python3 scripts/architecture/validate_external_sources.py
      - name: Focused real Guard, managed recovery and resource math tests
        # Compile/test critical regressions before slow monorepo typechecking.
        # The final full gate reruns these with all integration checks.
        run: |
          cargo test --locked --manifest-path kernel/Cargo.toml --lib resource_budget
          cargo test --locked --manifest-path kernel/Cargo.toml --test managed_control
          (cd packages/core && bun test test/session-runner-tool-registry.test.ts)
      - name: Full monorepo typecheck and Guard tests
        run: bash scripts/architecture/run_full_gate.sh
