<g font-family="Arial,sans-serif" font-weight="600" font-size="18" text-anchor="middle">
  <g><circle cx="170" cy="322" r="36" fill="#152234" stroke="#7896b1" stroke-width="2"/><text x="170" y="328" fill="#ebf1f6">01</text><text x="170" y="396" fill="#d0dce5">SPEC</text></g>
  <g><circle cx="483" cy="322" r="36" fill="#152234" stroke="#7896b1" stroke-width="2"/><text x="483" y="328" fill="#ebf1f6">02</text><text x="483" y="396" fill="#d0dce5">TASKS</text></g>
  <g><circle cx="796" cy="322" r="36" fill="#152234" stroke="#7896b1" stroke-width="2"/><text x="796" y="328" fill="#ebf1f6">03</text><text x="796" y="396" fill="#d0dce5">EXECUTE</text></g>
  <g><circle cx="1109" cy="322" r="36" fill="#152234" stroke="#7896b1" stroke-width="2"/><text x="1109" y="328" fill="#ebf1f6">04</text><text x="1109" y="396" fill="#d0dce5">VERIFY</text></g>
</g>
<path d="M76 492H1204" stroke="#2b3b4a" stroke-width="2"/>
<text x="640" y="542" fill="#7f96ad" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing="2.1">REAL VIDEO FOOTAGE GOES HERE · V1 WALKTHROUGH SLOT</text>
