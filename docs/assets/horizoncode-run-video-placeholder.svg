<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title description">
<title id="title">HorizonCode managed run video slot</title>
<desc id="description">Reserved space for an actual recording of a managed run; conceptual video title card, not a product screenshot.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#090b10"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#32455a"/><stop offset=".5" stop-color="#98adc5"/><stop offset="1" stop-color="#32455a"/></linearGradient>
</defs>
<rect width="1280" height="600" rx="20" fill="url(#background)"/>
<rect x="1" y="1" width="1278" height="598" rx="19" stroke="#354558" stroke-width="2" fill="none"/>
<text x="76" y="86" fill="#7795b0" font-family="Arial,sans-serif" font-size="17" letter-spacing="3.6" font-weight="700">HORIZONCODE / FULL RUN</text>
<text x="76" y="154" fill="#eef3f8" font-family="Arial,sans-serif" font-size="46" font-weight="700">From a goal to a verified result.</text>
<text x="77" y="197" fill="#a7b8c8" font-family="Arial,sans-serif" font-size="20">A place for the real walkthrough, recorded in the finished app.</text>
