[package]
name = "horizoncode-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
horizoncode-sandbox = { path = "../horizoncode-sandbox" }
horizon-indexd-library = { path = "../indexd" }
blake3 = "=1.8.7"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "bundled-windows"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
ring = "=0.17.14"
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
